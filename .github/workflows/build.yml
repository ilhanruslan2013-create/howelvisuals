name: Build HowelVisuals
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: build/libs/howelvisuals-1.0.0.jar
